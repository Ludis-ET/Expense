name: mobile
description: "Santim — personal finance with bank SMS capture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  permission_handler: ^11.3.1
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#047857"
  adaptive_icon_foreground: assets/branding/app_icon_fg.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
