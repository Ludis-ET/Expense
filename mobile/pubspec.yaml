name: santim
description: "Santim - know where every birr goes. Android client."
publish_to: 'none'
version: 1.0.5+2005

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State: plain ChangeNotifier trees, no code generation.
  provider: ^6.1.2
  # REST client for the Express backend.
  http: ^1.2.2
  # Token + preference persistence.
  shared_preferences: ^2.3.3
  # Currency / date formatting to match the web app's Intl output.
  intl: ^0.20.2
  # Opening wishlist links and guide references.
  url_launcher: ^6.3.1
  # Offline cache + mutation outbox (SQLite).
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  # Online/offline detection for sync flush.
  connectivity_plus: ^6.1.4
  # Client ids for optimistic offline creates.
  uuid: ^4.5.1
  # Runtime SMS + notification permissions (Android).
  permission_handler: ^11.4.0
  # Long-lived device token for SMS ingest (shown once at pair).
  flutter_secure_storage: ^9.2.4
  # Keep native splash until first Flutter frame (Android launch handoff).
  flutter_native_splash: ^2.4.6
  # App lock: fingerprint / face unlock.
  local_auth: ^2.3.0
  # PIN hash for app lock.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/santim_icon.png
  adaptive_icon_background: "#059669"
  adaptive_icon_foreground: assets/brand/santim_icon.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F4F6F9"
  image: assets/brand/santim_icon.png
  android: true
  ios: false
  android_12:
    color: "#F4F6F9"
    image: assets/brand/santim_icon.png
    icon_background_color: "#059669"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/santim_icon.png
